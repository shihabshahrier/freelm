[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freelm"
dynamic = ["version"]
description = "Free LLM API for Python: one OpenAI-compatible client and local endpoint (freelm serve) over the free tiers of Gemini, Groq, OpenRouter, Cloudflare Workers AI, Z.ai, Cohere, Mistral, NVIDIA NIM and Kilo, with automatic failover. CLI works with no keys."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shihab Shahriar Antor", email = "shahriarlabs@gmail.com" }]
keywords = [
    "llm", "free-llm", "free-llm-api", "free-ai-api", "llm-api", "llm-gateway", "llm-router",
    "ai-gateway", "llm-proxy", "openai-proxy", "openai-compatible", "openai-api", "openai",
    "openrouter", "gemini", "gemini-api", "google-ai-studio", "groq", "cerebras", "mistral",
    "nvidia-nim", "cohere", "cloudflare-workers-ai", "zai", "glm", "kilo", "no-api-key", "failover", "fallback", "rate-limit", "circuit-breaker", "key-rotation",
    "streaming", "tool-calling", "model-discovery", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "respx>=0.20", "anyio>=4", "ruff>=0.4"]

[project.urls]
Homepage = "https://shihub.site/freelm"
Documentation = "https://shihub.site/freelm/docs"
Repository = "https://github.com/shihabshahrier/freelm"
Changelog = "https://github.com/shihabshahrier/freelm/blob/main/CHANGELOG.md"
Issues = "https://github.com/shihabshahrier/freelm/issues"

[project.scripts]
freelm = "freelm._cli:main"

[tool.hatch.version]
path = "src/freelm/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/freelm"]

[tool.hatch.build.targets.sdist]
# explicit allow-list: never ship js/, local tool config, or anything untracked
include = ["/src/freelm", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
# Explicit rule set: ruff 0.16 widened its *default* selection, which turned
# CI red overnight without a code change. Pinning the selection keeps lint
# results stable across ruff upgrades.
select = ["E4", "E7", "E9", "F", "I"]
