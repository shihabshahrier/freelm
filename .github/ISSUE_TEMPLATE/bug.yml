name: Bug report
description: Something in freelm itself behaves wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code or CLI command. Never paste real API keys.
      render: python
  - type: input
    id: version
    attributes:
      label: freelm version, language and runtime
      placeholder: e.g. Python 0.4.0 on 3.12 / npm 0.4.0 on Node 22
    validations:
      required: true
