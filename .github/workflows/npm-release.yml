name: npm Release

# Publishes the js/ package to npm when a `js-v*` tag is pushed (e.g. js-v0.3.0),
# or on manual dispatch. Version comes from js/package.json. Idempotent: skips if
# that version is already on npm, so re-runs stay green.
#
# Auth, in order of preference:
#   1. npm Trusted Publishing (OIDC) — no token at all. One-time setup on
#      npmjs.com: package freelm -> Settings -> Trusted Publisher -> GitHub
#      Actions with user=shihabshahrier, repo=freelm, workflow=npm-release.yml.
#      Needs npm CLI >= 11.5.1 (installed below). Provenance is automatic.
#   2. Fallback: the NPM_TOKEN repo secret (granular write tokens now expire
#      after at most 90 days, so this needs periodic rotation — prefer 1).

on:
  push:
    tags: ["js-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing + provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Publish to npm (skip if version exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "freelm@$V" version >/dev/null 2>&1; then
            echo "freelm@$V already on npm — skipping."
          else
            npm publish --access public --provenance
          fi
